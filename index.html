<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Расписание Колледжа</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
    <div class="app">
        <!-- Шапка -->
        <header class="header">
            <h1 id="date-display">Загрузка...</h1>
            <select id="group-select" class="group-selector">
                <option value="">Выберите группу</option>
            </select>
            <button id="bell-schedule-btn" class="bell-btn">🔔 Расписание звонков</button>
        </header>

        <!-- Контент -->
        <main id="schedule-container" class="schedule">
            <div class="placeholder">👆 Выберите группу выше</div>
        </main>

        <!-- Индикатор загрузки -->
        <div id="loader" class="loader hidden"></div>

        <!-- Модальное окно расписания звонков -->
        <div id="bell-modal" class="modal hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>🔔 Расписание звонков</h2>
                    <button id="close-modal" class="close-btn">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="bell-tabs">
                        <button class="tab-btn active" data-day="monday">Понедельник</button>
                        <button class="tab-btn" data-day="other">Вт-Пт</button>
                    </div>
                    <div id="bell-content" class="bell-content">
                        <!-- Контент загружается через JS -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
