name: Auto Update Schedule

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: pip install openpyxl requests
        
      - name: Parse schedule
        run: python parse_schedule.py
        
      - name: Commit and push if changed
        run: |
          git config user.name "Schedule Bot"
          git config user.email "bot@users.noreply.github.com"
          git add schedule.json schedule.hash
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "🔄 Auto-update schedule $(date +%Y-%m-%d_%H:%M)"
            git push
          fi
