name: Auto Update Schedule

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-schedule
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: pip install openpyxl requests
        
      - name: Parse schedule
        run: python parse_schedule.py
        
      - name: Commit and push if changed
        run: |
          git config user.name "Schedule Bot"
          git config user.email "bot@users.noreply.github.com"
          git add schedule.json schedule.hash history.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "🔄 Auto-update schedule $(date +%Y-%m-%d_%H:%M)"
          if git push; then
            exit 0
          fi
          # Push lost a race against another commit. Drop the local commit so
          # schedule.hash stays at the remote value: the next run downloads the
          # same file, re-parses it and retries. Keeping the advanced hash would
          # make every later run report "No changes" and silently lose the day.
          echo "::warning::Push failed; resetting the local commit so the next run retries"
          git reset --hard HEAD~1
          exit 1
